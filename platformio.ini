; PlatformIO build (the sketch also builds in Arduino IDE / arduino-cli, see README).
[platformio]
src_dir = .
default_envs = smalltv

[env:smalltv]
platform = espressif8266@4.1.0        ; Arduino-ESP8266 core 3.1.x
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld   ; 4 MB flash: ~1 MB app + 2 MB LittleFS (OTA needs the free app slot)
board_build.f_cpu = 160000000L
upload_speed = 460800
monitor_speed = 115200
extra_scripts = pre:tools/patch_gfx_lib.py
lib_deps = moononournation/GFX Library for Arduino@1.6.8
build_src_filter = +<*> -<tests/> -<tools/> -<docs/> -<web/> -<.pio/>
build_flags = -Wl,-Map,.pio/build/smalltv/firmware.map -Wall -DATOMIC_FS_UPDATE=0 -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
